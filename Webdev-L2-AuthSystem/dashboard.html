<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">AuthSystem</div>
        <button id="logoutBtn" class="nav-logout">Logout</button>
    </nav>
    <div class="container dashboard-content">
        <h2 id="welcomeMessage">Welcome to your Dashboard</h2>
        <p>You have successfully logged in to the protected page.</p>
        <div class="grid">
            <div class="card">
                <h3>Profile</h3>
                <p>Manage your account settings and personal information.</p>
            </div>
            <div class="card">
                <h3>Settings</h3>
                <p>Customize your experience and security preferences.</p>
            </div>
            <div class="card">
                <h3>Notifications</h3>
                <p>Stay updated with the latest alerts and activity.</p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
